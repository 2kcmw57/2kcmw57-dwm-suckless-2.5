# picom.conf - minimal dwm-friendly configuration

backend = "glx";           # Use OpenGL for better performance
vsync = true;               # Enable vsync to prevent tearing
refresh-rate = 0;           # Auto-detect refresh rate

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -2;
shadow-offset-y = -2;
shadow-opacity = 0.35;
# No shadow for these windows
shadow-exclude = [
    "class_g = 'dmenu'",
    "class_g = 'Polybar'",
    "class_g = 'st'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-delta = 4;             # speed of fading
fade-in-step = 0.03;
fade-out-step = 0.03;

# Opacity
inactive-opacity = 0.85;    # windows when not focused
active-opacity = 1.0;       # focused windows
frame-opacity = 1.0;

# Rounded corners (if your build supports it)
corner-radius = 10;

# Transparency for specific windows
opacity-rule = [
    "90:class_g = 'URxvt'",
    "90:class_g = 'st'"
];

# Blur behind windows (requires experimental features)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;

# Exclude some windows from blur
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
